<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our Team</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="background-backdrop">
    <div class="ambient-glow glow-top"></div>
    <div class="ambient-glow glow-bottom"></div>
  </div>

  <div class="container">
    <header class="header">
      <span class="pill-tag">Member Directory</span>
      <h1>Meet the People Behind Our Work</h1>
      <p class="subtitle">Get in touch with our team members across leadership, design, engineering, and product.</p>

      <div class="controls-wrapper">
        <div class="search-input-wrap">
          <i class="fa-solid fa-magnifying-glass search-icon"></i>
          <input type="text" id="searchInput" placeholder="Search by name, role, email, or phone...">
          <button id="clearBtn" class="clear-search-btn" aria-label="Clear search">&times;</button>
        </div>

        <div class="action-buttons">
          <div class="layout-toggle">
            <button class="toggle-btn active" id="gridBtn" aria-label="Grid View">
              <i class="fa-solid fa-table-cells-large"></i>
            </button>
            <button class="toggle-btn" id="listBtn" aria-label="List View">
              <i class="fa-solid fa-list"></i>
            </button>
          </div>
        </div>
      </div>

      <nav class="category-filters" id="categoryFilters">
        <button class="filter-btn active" data-dept="all">All <span class="badge" id="countAll">0</span></button>
        <button class="filter-btn" data-dept="Leadership">Leadership <span class="badge" id="countLeadership">0</span></button>
        <button class="filter-btn" data-dept="Engineering">Engineering <span class="badge" id="countEngineering">0</span></button>
        <button class="filter-btn" data-dept="Design">Design <span class="badge" id="countDesign">0</span></button>
        <button class="filter-btn" data-dept="Product">Product <span class="badge" id="countProduct">0</span></button>
        <button class="filter-btn" data-dept="Marketing">Marketing <span class="badge" id="countMarketing">0</span></button>
      </nav>
    </header>

    <main>
      <div class="status-bar">
        <span id="memberCountText">Showing all members</span>
        <button id="resetSearchBtn" class="reset-link">Clear filters</button>
      </div>

      <section class="team-grid" id="teamGrid"></section>

      <div class="empty-state" id="emptyState">
        <div class="empty-icon">
          <i class="fa-solid fa-user-xmark"></i>
        </div>
        <h2>No team members found</h2>
        <p>Try searching for a different keyword or department.</p>
        <button class="reset-btn" id="emptyResetBtn">Reset Search</button>
      </div>
    </main>

    <footer class="footer">
      <p>© 2026 Team Directory.</p>
    </footer>
  </div>

  <div class="toast-stack" id="toastStack"></div>

  <script src="app.js"></script>
</body>
</html>
